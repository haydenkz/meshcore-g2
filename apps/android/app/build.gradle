plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def product = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json'))
def releaseSigning = ['MESHCORE_KEYSTORE_PATH', 'MESHCORE_KEYSTORE_PASSWORD',
        'MESHCORE_KEY_ALIAS', 'MESHCORE_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isBlank() }

android {
    namespace 'io.github.haydenkz.meshcorehelper'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.haydenkz.meshcorehelper'
        minSdk 26
        targetSdk 35
        versionCode product.config.androidVersionCode as int
        versionName product.version
        resValue 'string', 'app_name', 'MeshCore G2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.MESHCORE_KEYSTORE_PATH)
                storePassword releaseSigning.MESHCORE_KEYSTORE_PASSWORD
                keyAlias releaseSigning.MESHCORE_KEY_ALIAS
                keyPassword releaseSigning.MESHCORE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    lint { abortOnError true }
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/res/branding')
}

// Both apps consume the same checked-in artwork; generated resources stay in build/.
tasks.register('copyBranding', Copy) {
    from(rootProject.file('../../assets/meshcore-g2.png'))
    into(layout.buildDirectory.dir('generated/res/branding/drawable-nodpi'))
    rename { 'meshcore_g2.png' }
}
tasks.named('preBuild') { dependsOn 'copyBranding' }

tasks.register('requireReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is required. Configure MESHCORE_KEYSTORE_PATH, MESHCORE_KEYSTORE_PASSWORD, MESHCORE_KEY_ALIAS, and MESHCORE_KEY_PASSWORD, or use the debug variant for local development.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn 'requireReleaseSigning'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // Android 17 removes the reflective InputManager API used by Espresso 3.6.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
