name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  draft:
    name: Signed pair and draft release
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true
      - name: Build with the release signing key
        env:
          MESHCORE_KEYSTORE_BASE64: ${{ secrets.MESHCORE_KEYSTORE_BASE64 }}
          MESHCORE_KEYSTORE_PATH: ${{ runner.temp }}/meshcore-release.jks
          MESHCORE_KEYSTORE_PASSWORD: ${{ secrets.MESHCORE_KEYSTORE_PASSWORD }}
          MESHCORE_KEY_ALIAS: ${{ secrets.MESHCORE_KEY_ALIAS }}
          MESHCORE_KEY_PASSWORD: ${{ secrets.MESHCORE_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$MESHCORE_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['MESHCORE_KEYSTORE_BASE64', 'MESHCORE_KEYSTORE_PASSWORD', 'MESHCORE_KEY_ALIAS', 'MESHCORE_KEY_PASSWORD']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure release signing secrets: ' + ', '.join(missing))
          path = Path(os.environ['MESHCORE_KEYSTORE_PATH'])
          path.touch(mode=0o600)
          path.write_bytes(base64.b64decode(os.environ['MESHCORE_KEYSTORE_BASE64'], validate=True))
          PY
          node scripts/android.mjs release
      - name: Verify APK signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 apps/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: even-package
          path: dist/packages
      - run: node scripts/artifacts.mjs android release
      - run: node scripts/artifacts.mjs bundle release
      - name: Create draft with both installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" dist/bundle/* \
            --target "$GITHUB_SHA" --draft \
            --title "MeshCore G2 $version" \
            --notes-file dist/bundle/RELEASE_NOTES.md
